name: 🧪 Continuous Integration (PyTest & Quality)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    name: 🐍 Run PyTest Suite
    runs-on: ubuntu-latest

    steps:
      # 1. Descarregar el codi font del repositori
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar l'entorn de Python
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      # 3. Instal·lar les dependències del projecte
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      # 4. Configurar el PYTHONPATH i executar PyTest
      - name: 🧪 Run PyTest
        env:
          PYTHONPATH: ${{ github.workspace }}/src
        run: |
          pytest tests/unit -v
