name: 🧪 Continuous Integration (PyTest & Quality)

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: 🐍 Python ${{ matrix.python-version }} - Test & Quality
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.10", "3.11" ]

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GITHUB_REPO: ${{ github.repository }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'ci-dummy-gemini-api-key' }}
      APP_SECRET_KEY: ${{ secrets.APP_SECRET_KEY || 'ci-dummy-secret-key-with-at-least-32-bytes!' }}

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: 🔍 Lint with Ruff (PEP 8 + pydocstyle Google + Bandit)
        continue-on-error: true
        run: |
          ruff check src/ tests/

      - name: 📚 Validate Docstrings & Type Hints (Docs-as-Code Gate)
        run: |
          python -m src.utils.doc_updater --validate-docstrings

      - name: 🔎 Type check with Mypy
        continue-on-error: true
        run: |
          mypy src/

      - name: 🧪 Run PyTest with Coverage
        run: |
          pytest tests/unit -v --cov=src --cov-report=term-missing
