name: 📦 Automated Changelog Updater

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Versió SemVer opcional a publicar (ex: 0.4.0)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  changelog:
    name: 📝 Validate CHANGELOG.md Structure (Local Commit Sync)
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: 📥 Checkout repository with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🐍 Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: ✅ Verify CHANGELOG.md Keep a Changelog & SemVer format
        run: |
          python -c "from pathlib import Path; text = Path('CHANGELOG.md').read_text(encoding='utf-8'); assert '## [Unreleased]' in text, 'Falta secció ## [Unreleased] a CHANGELOG.md'"
          echo "✅ CHANGELOG.md validat correctament (actualitzat en local en temps de commit)."

